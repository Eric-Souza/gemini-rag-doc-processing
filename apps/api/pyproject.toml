[project]
name = "doc-processing-api"
version = "0.1.0"
description = "FastAPI backend for Doc Processing AI (Gemini RAG + LangGraph)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "pgvector>=0.3.6",
  "pydantic-settings>=2.6.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langgraph>=0.2.0",
  "langchain-google-genai>=2.0.0",
  "langchain-text-splitters>=0.3.0",
  "pypdf>=5.0.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "langsmith>=0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]
# Local cross-encoder reranker (pulls in PyTorch)
rerank = ["sentence-transformers>=3.0.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "evals*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
